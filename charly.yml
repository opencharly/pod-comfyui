comfyui:
    candy:
        description: |
            GPU image-generation server with ComfyUI + the Manager and model-download tooling baked in
            Clones ComfyUI to ~/ComfyUI plus the ComfyUI-Manager custom node and
            the full model directory tree, and installs the aria2 + git-lfs tooling
            used to fetch model checkpoints. A supervisord service runs
            `main.py --listen 0.0.0.0` on port 8188. Each piece is verifiable: the
            cloned entrypoint and Manager, the model dirs, the download-tooling
            packages, and the live /system_stats API on port 8188.
        require:
            - '@github.com/opencharly/layer-cuda:v2026.290.1513'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        env:
            COMFYUI_REF: v0.45.3
            # The checkpoint is fetched at FIRST BOOT, never baked into the image. These two are the
            # download inputs; the defaults are the artifact this candy was proven with, and both are
            # overridable per deploy (`charly config comfyui -e COMFYUI_MODEL_URL=…`). They are
            # declared HERE because the start script hard-requires them: an undeclared input would
            # turn a missing value into a container that starts and immediately dies.
            COMFYUI_MODEL: v1-5-pruned-emaonly-fp16.safetensors
            COMFYUI_MODEL_URL: https://huggingface.co/Comfy-Org/stable-diffusion-v1-5-archive/resolve/main/v1-5-pruned-emaonly-fp16.safetensors
            COMFYUI_MODEL_SHA256: e9476a13728cd75d8279f6ec8bad753a66a1957ca375a1464dc63b37db6e3916
            # A MODEL SET, fetched on first boot the same way the single checkpoint above is:
            # one entry per line, `<subdir>/<filename>|<url>|<sha256>`. This is the
            # quantized Z-Image-Turbo trio, sized to leave real headroom on a 16 GB card
            # (bf16 is 12.3 GB for the DiT alone and leaves nothing for a LoRA stack):
            #   diffusion_models 6.2 GB + text_encoders 5.6 GB + vae 0.34 GB ~= 12.2 GB.
            # Verified at the boundary: every file is sha256-checked before it is moved into
            # place. A partial download IS reused: `--continue-at -` resumes into the same .part, and the
            # file is only renamed into place after its sha256 verifies.
            # ONE LINE, with \n escapes, never a YAML block scalar: the value is substituted
            # textually into the emitted Containerfile, where a real newline becomes its own
            # Dockerfile line and the build dies with "unknown instruction: <modelpath>".
            COMFYUI_MODEL_SET: 'vae/ae.safetensors|https://huggingface.co/Comfy-Org/Z-Image-Turbo/resolve/main/split_files/vae/ae.safetensors|afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38\ntext_encoders/qwen_3_4b_fp8_mixed.safetensors|https://huggingface.co/Comfy-Org/Z-Image-Turbo/resolve/main/split_files/text_encoders/qwen_3_4b_fp8_mixed.safetensors|72450b19758172c5a7273cf7de729d1c17e7f434a104a00167624cba94f68f15\ndiffusion_models/z_image_turbo_int8_convrot.safetensors|https://huggingface.co/Comfy-Org/Z-Image-Turbo/resolve/main/split_files/diffusion_models/z_image_turbo_int8_convrot.safetensors|be517ebd47c912a5626a588e1aeea43e6be4a43c0cdcd2b48a2a780d9f358635'
            # The model-set wait bound. Declared HERE, not as a shell local: an assert-only
            # check resolves only the runner's auto-exported variables, and a shell local makes
            # the whole assertion DEAD. 12 GB at a pessimistic 10 Mbit/s is ~2.7 h, so the
            # default is generous; it exists to turn a hung fetch into a FAILURE, not to police
            # a slow link.
            COMFYUI_MODEL_SET_WAIT_SECS: "900"
        env_accept:
            - name: COMFYUI_MODEL_URL
              description: "Checkpoint download URL for first boot (default: the SD1.5 fp16 checkpoint this candy is proven with)."
            - name: COMFYUI_MODEL_SHA256
              description: "sha256 of that checkpoint; the first-boot download is verified against it before the server starts."
            - name: COMFYUI_MODEL
              description: "File name the checkpoint is stored as, under models/checkpoints (default: v1-5-pruned-emaonly-fp16.safetensors)."
            - name: COMFYUI_MODEL_SET
              description: "Extra model files fetched on first boot: one `subdir/filename|url|sha256` per line (default: the quantized Z-Image-Turbo trio). Set to empty to fetch none."
        distro:
            arch:
                package:
                    - aria2
                    - git-lfs
            fedora:
                package:
                    - aria2
                    - git-lfs
        port:
            - 8188
        volume:
            - name: comfyui
              path: "~/ComfyUI"
        service:
            - name: comfyui
              exec: /opt/comfyui/start-comfyui.sh
              restart: always
              working_directory: "%(ENV_HOME)s/ComfyUI"
              enable: true
              scope: system
        plan:
            - run: clone ComfyUI at the pinned RELEASE TAG into the image-owned app directory
              command: |
                set -eu
                git clone --depth 1 --branch "${COMFYUI_REF}" \
                  https://github.com/Comfy-Org/ComfyUI.git /opt/comfyui
                cd /opt/comfyui
                git describe --tags --always > .charly-ref
                cat .charly-ref
              run_as: root
            - run: write the ONE model-fetch helper both the launcher and the fetch script source
              write: /opt/comfyui/fetch-lib.sh
              mode: "0644"
              run_as: root
              content: |
                # Sourced by start-comfyui.sh (first-boot checkpoint) and fetch-model-set.sh
                # (the declared set). One implementation, so a fix to the resume/verify/retry
                # policy cannot land in one caller and miss the other.
                . /opt/comfyui/fetch-lib.sh
            - run: write the model-set fetch as its OWN SCRIPT, launched with setsid
              write: /opt/comfyui/fetch-model-set.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                # Launched with setsid from start-comfyui.sh. Backgrounding with `&` alone put
                # this in the start script's process group, and it was KILLED when that script
                # exec'd the server — which is why the download never completed and
                # model-set.done never appeared. setsid gives it its own session, so it
                # outlives the launcher.
                set -u
                BASE="${HOME}/ComfyUI"
                LOG="${BASE}/model-set-fetch.log"
                exec >> "${LOG}" 2>&1
                echo "=== fetch start $(date -u +%FT%TZ) ==="

                . /opt/comfyui/fetch-lib.sh

                while IFS='|' read -r rel url sha; do
                  [ -n "${rel:-}" ] || continue
                  DEST="${BASE}/models/${rel}"
                  mkdir -p "$(dirname "${DEST}")"
                  echo "fetching ${rel}"
                  fetch_verified "${DEST}" "${url}" "${sha:-}" || continue
                done < "${BASE}/model-set.manifest"

                touch "${BASE}/model-set.done"
                echo "=== fetch done $(date -u +%FT%TZ) ==="
            - run: write the model-set verification as a SCRIPT — an assert-only step with any
                shell variable is DEAD, so the logic cannot live inline
              write: /opt/comfyui/check-model-set.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                set -eu
                # Verifies the model-set FETCH MECHANISM, on a timescale a bed can observe.
                #
                # It deliberately does NOT wait for a 12 GB download: the earlier version did, and the bed
                # killed the check before it could report ("execution error: process terminated by signal"),
                # so it proved nothing AND said nothing. What IS provable quickly: the declaration reached the
                # container, the launcher wrote the manifest, the fetch ran, at least one declared file landed
                # with a matching sha256, and the log reports no failure.
                BASE="${HOME}/ComfyUI"

                if [ ! -s "${BASE}/model-set.manifest" ]; then
                  echo "no model-set manifest at ${BASE}/model-set.manifest" >&2
                  exit 1
                fi
                if ! grep -q . "${BASE}/model-set.manifest"; then
                  echo "the declared model set is empty; nothing to verify"
                  exit 0
                fi
                if [ -s "${BASE}/model-set-fetch.log" ] && grep -qE 'FAILED|SHA MISMATCH' "${BASE}/model-set-fetch.log"; then
                  echo "the fetch reported a failure:" >&2
                  grep -E 'FAILED|SHA MISMATCH' "${BASE}/model-set-fetch.log" >&2
                  exit 1
                fi
                # Wait, BOUNDED, for the first file to land. The set is ordered smallest-first,
                # so the 335 MB VAE arrives in well under this; the bound exists only to turn a
                # dead fetch into a reported failure rather than an indefinite wait. Safe to
                # loop here because this runs as a SCRIPT, not as an inline assert-only step.
                bound=$(cat "${BASE}/model-set.bound" 2>/dev/null || echo 900)
                waited=0
                found=0
                while :; do
                  found=0
                  while IFS='|' read -r rel url sha; do
                    [ -n "${rel:-}" ] || continue
                    if [ -s "${BASE}/models/${rel}" ]; then
                      found=$((found + 1))
                    fi
                  done < "${BASE}/model-set.manifest"
                  [ "${found}" -gt 0 ] && break
                  [ "${waited}" -ge "${bound}" ] && break
                  sleep 10
                  waited=$((waited + 10))
                done
                if [ "${found}" -eq 0 ]; then
                  echo "no declared model file has landed yet; the fetch has produced nothing" >&2
                  cat "${BASE}/model-set-fetch.log" >&2 2>/dev/null || true
                  exit 1
                fi
                echo "${found} declared model file(s) present, fetch log clean"
            - run: write the start script that seeds the state tree, ensures the model, then execs the server
              write: /opt/comfyui/start-comfyui.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                set -eu
                # The APPLICATION lives in the image (/opt/comfyui, pinned tag); ALL state lives in the
                # `comfyui` volume, addressed by ComfyUI's own --base-directory. ComfyUI creates only
                # some of these on demand, so the tree is seeded here: a missing custom_nodes/ is a
                # hard start failure (measured), and the model directories must exist before a
                # checkpoint is fetched into one.
                BASE="${HOME}/ComfyUI"
                mkdir -p "${BASE}"/{custom_nodes,input,output,user}
                mkdir -p "${BASE}"/models/{checkpoints,clip,clip_vision,configs,controlnet}
                mkdir -p "${BASE}"/models/{diffusers,diffusion_models,embeddings,gligen,hypernetworks,loras}
                mkdir -p "${BASE}"/models/{photomaker,style_models,text_encoders,unet,upscale_models,vae,vae_approx}
                # ONE fetch path for every model file, whatever declares it. Resume into a
                # .part, verify the sha256, then rename into place — extracted because the
                # single checkpoint and the model set were two copies of this same sequence
                # (R2), and a second copy drifts.
                fetch_verified() {
                  _dest="$1"; _url="$2"; _sha="$3"
                  if [ -s "${_dest}" ]; then return 0; fi
                  _try=0
                  while [ "${_try}" -lt 2 ]; do
                    _try=$((_try + 1))
                    curl -fL --continue-at - --output "${_dest}.part" "${_url}" \
                      || { echo "FAILED ${_dest} (attempt ${_try})" >&2; rm -f "${_dest}.part"; return 1; }
                    if [ -z "${_sha}" ]; then break; fi
                    if printf '%s  %s\n' "${_sha}" "${_dest}.part" | sha256sum -c - >/dev/null; then
                      break
                    fi
                    # A RESUMED transfer can be corrupt: the resumed bytes may not match what the
                    # origin served (a redirect target that ignores Range, a changed object). The
                    # first version of this deleted the .part and gave up, so a 6.2 GB file that
                    # failed verification never landed at all. Discard and retry ONCE from scratch
                    # before declaring failure — and say which attempt failed and why.
                    echo "SHA MISMATCH ${_dest} (attempt ${_try}; discarding the partial file)" >&2
                    rm -f "${_dest}.part"
                    if [ "${_try}" -ge 2 ]; then
                      echo "GIVING UP ${_dest}: verification failed on a clean re-download" >&2
                      return 1
                    fi
                  done
                  if [ -n "${_sha}" ] && ! printf '%s  %s\n' "${_sha}" "${_dest}.part" | sha256sum -c - >/dev/null 2>&1; then
                    return 1
                  fi
                  mv "${_dest}.part" "${_dest}"
                }
                CKPT="${BASE}/models/checkpoints/${COMFYUI_MODEL}"
                fetch_verified "${CKPT}" \
                  "${COMFYUI_MODEL_URL:?COMFYUI_MODEL_URL must be declared by the candy or set per deploy}" \
                  "${COMFYUI_MODEL_SHA256:?COMFYUI_MODEL_SHA256 must be declared by the candy or set per deploy}"
                # The MODEL SET runs in the BACKGROUND, deliberately: it is ~12 GB, and doing it
                # before the server starts would push every cold boot past the window this bed and
                # its callers allow for a first response. ComfyUI only needs these files when a
                # workflow references them, so the server comes up first and the weights land
                # behind it. Same discipline as the checkpoint: sha256 verified before the
                # move, and a .part is RESUMED (--continue-at -) rather than discarded.
                # The DECLARED set and its wait bound are written to files at launch, so the
                # assert-only check can read them WITHOUT a braced reference to a candy env
                # var: an unresolvable ${VAR} makes the step SKIP, and a skip reads green.
                printf '%b\n' "${COMFYUI_MODEL_SET:-}" > "${BASE}/model-set.manifest"
                printf '%s\n' "${COMFYUI_MODEL_SET_WAIT_SECS:-7200}" > "${BASE}/model-set.bound"
                if [ -n "${COMFYUI_MODEL_SET:-}" ]; then
                  # setsid: its own session. `&` alone left this in the start script's process
                  # group and it was killed when the script exec'd the server, so the download
                  # never finished and model-set.done never appeared.
                  setsid /opt/comfyui/fetch-model-set.sh > /dev/null 2>&1 &
                  echo "model set fetching in its own session (log: ${BASE}/model-set-fetch.log)"
                else
                  touch "${BASE}/model-set.done"
                fi
                exec python /opt/comfyui/main.py --listen 0.0.0.0 --port 8188 \
                  --enable-manager --base-directory "${BASE}"
            - check: the image records the ComfyUI release tag it was built from
              id: comfyui-pinned-ref
              # No authored variable here on purpose: a braced ${VAR} the check context cannot
              # resolve makes the step SKIP, and a skip reads green (measured on a bed run --
              # "unresolved variables: COMFYUI_REF"). The BED owns the tag value and asserts it
              # against the server's own API; this check asserts the FILE, which needs no env.
              command: test -s /opt/comfyui/.charly-ref && grep -qE '^v[0-9]+\.[0-9]+' /opt/comfyui/.charly-ref
              exit_status: 0
            - check: the start script is present and executable
              id: comfyui-start-script
              file:
                file: /opt/comfyui/start-comfyui.sh
                exists: true
                mode: "0755"
            - check: the ComfyUI entrypoint is the image-owned application, not a git clone in the state volume
              id: comfyui-app-entrypoint
              file:
                file: /opt/comfyui/main.py
                exists: true
            - check: the legacy ComfyUI-Manager checkout is GONE — the built-in manager replaces it
              id: comfyui-legacy-manager-absent
              file:
                file: /opt/comfyui/custom_nodes/ComfyUI-Manager
                exists: false
            - check: aria2c is installed so model checkpoints can be fetched in parallel
              id: comfyui-aria2-binary
              file:
                file: /usr/bin/aria2c
                exists: true
            - check: git-lfs is installed for pulling large model repositories
              id: comfyui-git-lfs-package
              package:
                package: git-lfs
                installed: true
            - check: the live server reports its version and the GPU device
              id: comfyui-system-stats
              context:
                - runtime
              # On a FRESH volume the server is still fetching a 2 GB checkpoint when this runs;
              # a single-shot probe gets "connection reset by peer" (measured). The window makes
              # a cold boot a wait instead of a failure.
              eventually: 5m
              retry_interval: 10s
              http:
                http: http://127.0.0.1:${HOST_PORT:8188}/system_stats
                status: 200
                body:
                    - contains: comfyui_version
            - check: the model checkpoint lives in the STATE volume, not in the image
              id: comfyui-model-in-volume
              context:
                - runtime
              # BARE $VAR, not ${VAR}: the plan runner expands a braced reference against the
              # TASK env and SKIPS the step when it cannot (measured), while a bare reference
              # passes through to the shell, which reads the CONTAINER's environment at run
              # time. The `-n` guard matters: without it an unset name would test the
              # checkpoints/ DIRECTORY, and `test -s` on a directory is true.
              command: |
                set -eu
                test -n "$COMFYUI_MODEL"
                test -s "$HOME/ComfyUI/models/checkpoints/$COMFYUI_MODEL"
              exit_status: 0

            - check: every file the declared Z-Image model SET names is present in the state volume
              id: comfyui-model-set-in-volume
              context:
                - runtime
              # A SCRIPT, not an inline body. An assert-only step resolves only the runner's
              # auto-exported variables, so EVERY shell variable — even one the step assigns
              # itself, like `BOUND` — makes the assertion DEAD ("these names can never resolve
              # here: BOUND"). The logic lives in a file the image bakes, and this step is one
              # command with no variables of its own.
              command: /opt/comfyui/check-model-set.sh
              exit_status: 0


comfyui-skill:
    skill:
        name: comfyui
        family: comfyui
        owner: comfyui
        description: |-
            ComfyUI image generation server with CUDA GPU support.
            Runs as a supervisord service on port 8188 with persistent storage.
            MUST be invoked before building, deploying, configuring, or troubleshooting the comfyui box.

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows). The prose is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an inline `description:`
# or `content:` — an inline body that disagrees with its file is a hard error
# in the marketplace generator. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
comfyui-layer-skill:
    skill:
        name: comfyui-layer
        family: comfyui
        owner: comfyui
