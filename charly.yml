comfyui:
    candy:
        description: |
            GPU image-generation server with ComfyUI, its built-in manager, and model-download tooling baked in
            Clones ComfyUI at the pinned COMFYUI_REF tag into the image-owned
            /opt/comfyui, and keeps every mutable thing in the comfyui volume at
            ~/ComfyUI through ComfyUI's own --base-directory. The built-in manager
            is enabled (--enable-manager); there is no ComfyUI-Manager custom-node
            clone. aria2 and git-lfs fetch the checkpoint and the model set on
            first boot. A supervisord service runs /opt/comfyui/start-comfyui.sh,
            which seeds the state tree, writes the model-set manifest and launches
            the fetch before it execs main.py --listen 0.0.0.0 --port 8188. Each
            piece is verifiable: the pinned app clone, the model dirs, the
            download-tooling packages, and the live /system_stats API on port 8188.
        # A CANDY DECLARES WHAT IT NEEDS TO RUN; THE BOX DECLARES THE SUBSTRATE'S GPU
        # CONTRACT. This candy needs the supervisord SERVICE and nothing else: it clones
        # ComfyUI (Python), installs it from pixi.toml, and supervises `main.py`. It never
        # compiles a CUDA translation unit, never invokes nvcc, and never links against the
        # toolkit — torch arrives as the cu130 wheel (which BUNDLES its CUDA runtime), and
        # the DRIVER comes from wherever the substrate supplies it:
        #   * pod  -> layer-cdi: the kernel module is host-global, the runtime injects the
        #            driver user-space per container through /etc/cdi/nvidia.yaml;
        #   * VM   -> layer-nvidia + layer-cuda: the guest owns its kernel module and must
        #            bake the driver user-space.
        # `require: layer-cuda` here asserted the VM contract for EVERY consumer, so a CDI
        # pod image inheriting this candy composed layer-nvidia's install and layer-cuda's
        # strip after its own base had already applied them — and then reported the VM
        # layer's `nvidia-ctk` assertions as failures on a pod that must never have
        # `nvidia-ctk` at all (opencharly/pod-comfyui#24). The substrate belongs to the box.
        require:
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        env:
            # A host-owned bind makes charly run the container as root under its keep-id
            # mapping, where the runtime HOME is /root — while the state volume and the
            # models bind are mounted under the image user's home. Pin it so a bound
            # deployment uses both instead of re-fetching every model into /root.
            HOME: "/home/user"
            COMFYUI_REF: v0.46.1
            # GB of VRAM kept completely free and unused, counting other apps.
            # Overridable per deploy (`charly config comfyui -e COMFYUI_VRAM_HEADROOM=4`).
            COMFYUI_VRAM_HEADROOM: "1"
            # The checkpoint is fetched at FIRST BOOT, never baked into the image. These two are the
            # download inputs; the defaults are the artifact this candy was proven with, and both are
            # overridable per deploy (`charly config comfyui -e COMFYUI_MODEL_URL=…`). They are
            # declared HERE because the start script hard-requires them: an undeclared input would
            # turn a missing value into a container that starts and immediately dies.
            COMFYUI_MODEL: v1-5-pruned-emaonly-fp16.safetensors
            COMFYUI_MODEL_URL: https://huggingface.co/Comfy-Org/stable-diffusion-v1-5-archive/resolve/main/v1-5-pruned-emaonly-fp16.safetensors
            COMFYUI_MODEL_SHA256: e9476a13728cd75d8279f6ec8bad753a66a1957ca375a1464dc63b37db6e3916
            # The canonical model list lives in models/model-manifest.tsv, copied into the image
            # and read by start-comfyui.sh on every boot. It is the single source for every
            # model file (the user's Qwen/Edit/Z-Image/Wan set plus companions); the fetcher
            # verifies each sha256 before moving a file into place, and existing files are
            # skipped. See the file header for the disk budget.
            COMFYUI_MODEL_SET_WAIT_SECS: "600"
        env_accept:
            - name: COMFYUI_MODEL_URL
              description: "Checkpoint download URL for first boot (default: the SD1.5 fp16 checkpoint this candy is proven with)."
            - name: COMFYUI_MODEL_SHA256
              description: "sha256 of that checkpoint; the first-boot download is verified against it before the server starts."
            - name: COMFYUI_MODEL
              description: "File name the checkpoint is stored as, under models/checkpoints (default: v1-5-pruned-emaonly-fp16.safetensors)."
        env_provide:
            COMFYUI_BASE_URL: "http://{{.ContainerName}}:8188"
            IMAGES_EDIT_COMFYUI_BASE_URL: "http://{{.ContainerName}}:8188"
            IMAGE_SIZE: "1024x1024"
            IMAGE_STEPS: "8"
            COMFYUI_WORKFLOW_B64: ''
            COMFYUI_WORKFLOW_NODES: '[{"type":"prompt","node_ids":["452"],"key":"prompt"},{"type":"width","node_ids":["456"],"key":"width"},{"type":"height","node_ids":["456"],"key":"height"},{"type":"n","node_ids":["456"],"key":"batch_size"},{"type":"seed","node_ids":["488"],"key":"noise_seed"}]'
            IMAGES_EDIT_COMFYUI_WORKFLOW_B64: ''
            IMAGES_EDIT_COMFYUI_WORKFLOW_NODES: '[{"type":"image","node_ids":["41"],"key":"image"},{"type":"prompt","node_ids":["151"],"key":"prompt"},{"type":"seed","node_ids":["169"],"key":"seed"}]'
        distro:
            arch:
                package:
                    - aria2
                    - git-lfs
            fedora:
                package:
                    - aria2
                    - git-lfs
        port:
            - 8188
        volume:
            - name: comfyui
              path: "~/ComfyUI"
        service:
            - name: comfyui
              exec: /opt/comfyui/start-comfyui.sh
              restart: always
              working_directory: "%(ENV_HOME)s/ComfyUI"
              enable: true
              scope: system
        plan:
            - run: clone ComfyUI at the pinned RELEASE TAG into the image-owned app directory
              command: |
                set -eu
                git clone --depth 1 --branch "${COMFYUI_REF}" \
                  https://github.com/Comfy-Org/ComfyUI.git /opt/comfyui
                cd /opt/comfyui
                git describe --tags --always > .charly-ref
                cat .charly-ref
              run_as: root
            - run: install the canonical model manifest
              copy: models/model-manifest.tsv
              to: /opt/comfyui/model-manifest.tsv
              mode: "0644"
              run_as: root
            - run: install the candy manifest so the workflow-provides gate can read its env_provide values
              copy: charly.yml
              to: /opt/comfyui/charly.yml
              mode: "0644"
              run_as: root
            - run: install the Qwen-Image-2.1 Turbo T2I API workflow
              copy: workflows/qwen-image-2.1-turbo-t2i.api.json
              to: /opt/comfyui/workflows/qwen-image-2.1-turbo-t2i.api.json
              mode: "0644"
              run_as: root
            - run: install the Qwen-Image-Edit-2511 Lightning API workflow
              copy: workflows/qwen-image-edit-2511-lightning.api.json
              to: /opt/comfyui/workflows/qwen-image-edit-2511-lightning.api.json
              mode: "0644"
              run_as: root
            - run: install the Z-Image-Turbo int8 fallback API workflow
              copy: workflows/z-image-turbo-int8.api.json
              to: /opt/comfyui/workflows/z-image-turbo-int8.api.json
              mode: "0644"
              run_as: root
            - run: install the Z-Image-Turbo bf16 fallback API workflow
              copy: workflows/z-image-turbo-bf16.api.json
              to: /opt/comfyui/workflows/z-image-turbo-bf16.api.json
              mode: "0644"
              run_as: root
            - run: install the Wan 2.2 5B TI2V API workflow
              copy: workflows/wan2.2-5b-ti2v.api.json
              to: /opt/comfyui/workflows/wan2.2-5b-ti2v.api.json
              mode: "0644"
              run_as: root
            - run: install the manifest/workflow completeness gate
              copy: scripts/check-model-manifest.sh
              to: /opt/comfyui/check-model-manifest.sh
              mode: "0755"
              run_as: root
            - run: install the workflow-provides drift gate
              copy: scripts/check-workflow-provides.sh
              to: /opt/comfyui/check-workflow-provides.sh
              mode: "0755"
              run_as: root
            - run: write the ONE model-fetch helper both the launcher and the fetch script source
              write: /opt/comfyui/fetch-lib.sh
              mode: "0644"
              run_as: root
              content: |
                fetch_verified() {
                  _dest="$1"; _url="$2"; _sha="$3"
                  if [ -s "${_dest}" ]; then return 0; fi
                  _try=0
                  while [ "${_try}" -lt 2 ]; do
                    _try=$((_try + 1))
                    curl -fL --continue-at - --output "${_dest}.part" "${_url}" \
                      || { echo "FAILED ${_dest} (attempt ${_try})" >&2; rm -f "${_dest}.part"; return 1; }
                    if [ -z "${_sha}" ]; then break; fi
                    if printf '%s  %s\n' "${_sha}" "${_dest}.part" | sha256sum -c - >/dev/null; then
                      break
                    fi
                    # A RESUMED transfer can be corrupt: the resumed bytes may not match what the
                    # origin served (a redirect target that ignores Range, a changed object). The
                    # first version of this deleted the .part and gave up, so a 6.2 GB file that
                    # failed verification never landed at all. Discard and retry ONCE from scratch
                    # before declaring failure — and say which attempt failed and why.
                    echo "SHA MISMATCH ${_dest} (attempt ${_try}; discarding the partial file)" >&2
                    rm -f "${_dest}.part"
                    if [ "${_try}" -ge 2 ]; then
                      echo "GIVING UP ${_dest}: verification failed on a clean re-download" >&2
                      return 1
                    fi
                  done
                  if [ -n "${_sha}" ] && ! printf '%s  %s\n' "${_sha}" "${_dest}.part" | sha256sum -c - >/dev/null 2>&1; then
                    return 1
                  fi
                  mv "${_dest}.part" "${_dest}"
                }
            - run: write the model-set fetch as its OWN SCRIPT, launched with setsid
              write: /opt/comfyui/fetch-model-set.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                # Launched with setsid from start-comfyui.sh. Backgrounding with `&` alone put
                # this in the start script's process group, and it was KILLED when that script
                # exec'd the server — which is why the download never completed and
                # model-set.done never appeared. setsid gives it its own session, so it
                # outlives the launcher.
                set -u
                BASE="${HOME}/ComfyUI"
                LOG="${BASE}/model-set-fetch.log"
                exec >> "${LOG}" 2>&1
                echo "=== fetch start $(date -u +%FT%TZ) ==="

                . /opt/comfyui/fetch-lib.sh

                while IFS='|' read -r rel url sha; do
                  [ -n "${rel:-}" ] || continue
                  DEST="${BASE}/models/${rel}"
                  mkdir -p "$(dirname "${DEST}")"
                  echo "fetching ${rel}"
                  fetch_verified "${DEST}" "${url}" "${sha:-}" || continue
                done < "${BASE}/model-set.manifest"

                touch "${BASE}/model-set.done"
                echo "=== fetch done $(date -u +%FT%TZ) ==="
            - run: write the model-set verification as a SCRIPT — an assert-only step with any
                shell variable is DEAD, so the logic cannot live inline
              write: /opt/comfyui/check-model-set.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                set -eu
                # Verifies the model-set FETCH MECHANISM, on a timescale a bed can observe.
                #
                # It deliberately does NOT wait for the full ~128 GiB download: the earlier version did, and the bed
                # killed the check before it could report ("execution error: process terminated by signal"),
                # so it proved nothing AND said nothing. What IS provable quickly: the declaration reached the
                # container, the launcher wrote the manifest, the fetch ran, at least one declared file landed
                # with a matching sha256, and the log reports no failure.
                BASE="${HOME}/ComfyUI"

                if [ ! -s "${BASE}/model-set.manifest" ]; then
                  echo "no model-set manifest at ${BASE}/model-set.manifest" >&2
                  exit 1
                fi
                if ! grep -q . "${BASE}/model-set.manifest"; then
                  echo "the declared model set is empty; nothing to verify"
                  exit 0
                fi
                if [ -s "${BASE}/model-set-fetch.log" ] && grep -qE 'FAILED|SHA MISMATCH' "${BASE}/model-set-fetch.log"; then
                  echo "the fetch reported a failure:" >&2
                  grep -E 'FAILED|SHA MISMATCH' "${BASE}/model-set-fetch.log" >&2
                  exit 1
                fi
                # Wait, BOUNDED, for the first file to land. The set is ordered smallest-first,
                # so the 335 MB VAE arrives in well under this; the bound exists only to turn a
                # dead fetch into a reported failure rather than an indefinite wait. Safe to
                # loop here because this runs as a SCRIPT, not as an inline assert-only step.
                # The bound is READ from the file the launcher writes, so the declared
                # COMFYUI_MODEL_SET_WAIT_SECS governs instead of a second hardcoded number.
                bound=$(cat "${BASE}/model-set.bound" 2>/dev/null || echo 600)
                case "${bound}" in ''|*[!0-9]*) bound=600 ;; esac
                waited=0
                found=0
                while :; do
                  found=0
                  while IFS='|' read -r rel url sha; do
                    [ -n "${rel:-}" ] || continue
                    if [ -s "${BASE}/models/${rel}" ]; then
                      found=$((found + 1))
                    fi
                  done < "${BASE}/model-set.manifest"
                  [ "${found}" -gt 0 ] && break
                  [ "${waited}" -ge "${bound}" ] && break
                  sleep 10
                  waited=$((waited + 10))
                done
                if [ "${found}" -eq 0 ]; then
                  echo "no declared model file has landed yet; the fetch has produced nothing" >&2
                  cat "${BASE}/model-set-fetch.log" >&2 2>/dev/null || true
                  exit 1
                fi
                echo "${found} declared model file(s) present, fetch log clean"
            - run: write the runtime check that a completed prompt releases the model from VRAM
              write: /opt/comfyui/check-vram-offload.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                set -eu
                # The runtime assertion of the Dynamic VRAM configuration: a prompt puts weights on
                # the card and completes without OOM. Dynamic VRAM (comfy_aimdo) is on by default
                # for torch >= 2.8 on Nvidia; it faults weights in per layer and evicts under
                # pressure, so a post-prompt "settled" reading is NOT a contract. The pre-Dynamic
                # check asserted exactly the release that the legacy --disable-smart-memory flag
                # forced; check-launch-flags.sh now forbids that flag.
                #
                # It records the device peak, never a per-run load delta: Dynamic VRAM keeps a
                # model resident between prompts, so a second run legitimately shows little or no
                # rise. The launch CONTRACT (no legacy flag) is asserted by comfyui-launch-flags.
                #
                # A SCRIPT, not an inline assert-only step: every shell variable in such a step --
                # even one the step assigns itself -- makes the assertion DEAD (measured on a bed run).
                BASE="${HOME}/ComfyUI"
                PORT="${HOST_PORT:-8188}"
                API="http://127.0.0.1:${PORT}"
                # No LOADED_MIB threshold: see the header. The runtime claim is completion.

                vram_used_mib() {
                  if command -v nvidia-smi >/dev/null 2>&1; then
                    nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | head -n1 | tr -dc '0-9'
                    return 0
                  fi
                  # No nvidia-smi (a VM without the toolkit binary): torch's device-wide free/total.
                  # This spawns a CUDA context of its own, which is why the delta thresholds carry slack.
                  python -c 'import torch; f,t=torch.cuda.mem_get_info(); print((t-f)//(1024**2))'
                }

                # 1. The server and the checkpoint. On a fresh volume the 2 GB checkpoint is still
                #    being fetched, and a prompt naming it would be rejected.
                waited=0
                while ! curl -sf -o /dev/null "${API}/system_stats"; do
                  if [ "${waited}" -ge 300 ]; then
                    echo "the server did not answer ${API}/system_stats within 300s" >&2
                    exit 1
                  fi
                  sleep 5
                  waited=$((waited + 5))
                done
                waited=0
                while [ ! -s "${BASE}/models/checkpoints/${COMFYUI_MODEL}" ]; do
                  if [ "${waited}" -ge 600 ]; then
                    echo "the checkpoint ${COMFYUI_MODEL} did not land within 600s" >&2
                    exit 1
                  fi
                  sleep 5
                  waited=$((waited + 5))
                done

                # 2. One small generation -- the load the flag acts on. 512x512, 8 steps: long enough
                #    to hold the weights on the card for several samples, short enough for a bed.
                # A UNIQUE graph per run, or ComfyUI serves the SECOND identical prompt from its
                # execution cache: nothing loads, the card's usage never rises, and this check's
                # own load assertion fails for a reason that has nothing to do with the flag
                # (measured on a bed run -- check-live PASS, then feature-run "peak rose 0 MiB").
                nonce=$(date +%s)
                payload=$(cat <<JSON
                {"prompt":{
                  "1":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":"${COMFYUI_MODEL}"}},
                  "2":{"class_type":"CLIPTextEncode","inputs":{"text":"a red apple","clip":["1",1]}},
                  "3":{"class_type":"CLIPTextEncode","inputs":{"text":"blurry","clip":["1",1]}},
                  "4":{"class_type":"EmptyLatentImage","inputs":{"width":512,"height":512,"batch_size":1}},
                  "5":{"class_type":"KSampler","inputs":{"seed":${nonce},"steps":8,"cfg":7.0,"sampler_name":"euler","scheduler":"normal","denoise":1.0,"model":["1",0],"positive":["2",0],"negative":["3",0],"latent_image":["4",0]}},
                  "6":{"class_type":"VAEDecode","inputs":{"samples":["5",0],"vae":["1",2]}},
                  "7":{"class_type":"SaveImage","inputs":{"filename_prefix":"charly-vram-check-${nonce}","images":["6",0]}}
                }}
                JSON
                )
                before=$(vram_used_mib)
                peak="${before}"
                reply=$(curl -sf -X POST -H 'Content-Type: application/json' -d "${payload}" "${API}/prompt") || {
                  echo "POST ${API}/prompt failed" >&2
                  exit 1
                }
                id=$(printf '%s' "${reply}" | sed -n 's/.*"prompt_id" *: *"\([^"]*\)".*/\1/p')
                if [ -z "${id}" ]; then
                  echo "no prompt_id in the API reply: ${reply}" >&2
                  exit 1
                fi

                # 3. Follow the prompt to success, sampling the card as it runs.
                #
                # THE PERIOD IS PART OF THE ASSERTION, not a tuning detail. The checkpoint sits on
                # the card for the whole EXECUTION phase, and on this 512x512/8-step prompt that
                # phase lasts a few tenths of a second. The sampler this replaces slept a full
                # second on top of an nvidia-smi fork and a /history call -- an effective period of
                # 1.3-1.5 s -- so a 1.22 s prompt could fall ENTIRELY between two samples: the run
                # then reported `peak rose 4 MiB` on a device that had loaded the model correctly.
                # The same run passed at 1.79 s and failed at 1.22 s on one steady device
                # (measured), i.e. the check was racing its own sampler, not the deployment.
                #
                # SAMPLE_PERIOD_MS is derived from measurement, not chosen. A 24 ms whole-device
                # trace of THIS pod running real prompts (nvidia-smi --query-gpu=memory.used on
                # the host, 2026-11-19) gives the loaded window directly:
                #
                #   prompt | at or above 4000 MiB | at or above 5000 MiB | peak  | rise over pre-prompt
                #     1    |        1.40 s        |        0.91 s        | 5253  |      +1942 MiB
                #     2    |        1.97 s        |        1.23 s        | 5259  |      +1828 MiB
                #
                # So the checkpoint IS fully resident, for roughly a second or two. The old
                # ~1.3-1.5 s loop held 0-1 samples inside that window and could miss a 1.22 s
                # prompt entirely; a 100 ms period holds 9-12. That is why the threshold below
                # stays at 1024 MiB: the measured rise is +1828 MiB, an 804 MiB margin, so the
                # sampler -- not the threshold -- was the defect.
                #
                # The run REPORTS the sample count, the largest gap and the prompt duration, so a
                # reader can see the margin instead of assuming it. HISTORY_PERIOD_MS stays at 1 s
                # because the /history poll costs a local HTTP round trip and completion state is
                # stable for far longer than the load window the peak has to be caught in -- the
                # completion poll must not set the device-sampling cadence.
                SAMPLE_PERIOD_MS=100
                HISTORY_PERIOD_MS=1000
                started_ns=$(date +%s%N)
                last_ns=${started_ns}
                max_gap_ms=0
                samples=0
                next_history_ns=0
                while :; do
                  sample_ns=$(date +%s%N)
                  used=$(vram_used_mib)
                  [ "${used}" -gt "${peak}" ] && peak="${used}"
                  samples=$((samples + 1))
                  gap_ms=$(( (sample_ns - last_ns) / 1000000 ))
                  [ "${gap_ms}" -gt "${max_gap_ms}" ] && max_gap_ms=${gap_ms}
                  last_ns=${sample_ns}
                  # The /history poll rides the same loop on a slower cadence: it costs a local
                  # HTTP round trip, and the completion state is stable for far longer than the
                  # load window the peak has to be caught in.
                  if [ "${sample_ns}" -ge "${next_history_ns}" ]; then
                    hist=$(curl -sf "${API}/history/${id}" || true)
                    printf '%s' "${hist}" | grep -qE '"status_str" *: *"success"' && break
                    if printf '%s' "${hist}" | grep -qE '"status_str" *: *"error"'; then
                      echo "the prompt reported an error:" >&2
                      printf '%s\n' "${hist}" >&2
                      exit 1
                    fi
                    next_history_ns=$(( sample_ns + HISTORY_PERIOD_MS * 1000000 ))
                  fi
                  elapsed_ms=$(( (sample_ns - started_ns) / 1000000 ))
                  if [ "${elapsed_ms}" -ge 240000 ]; then
                    echo "prompt ${id} did not complete within 240s" >&2
                    exit 1
                  fi
                  # Pace the sampler: sleep only the part of the period this sample did not spend,
                  # so a slow nvidia-smi degrades into back-to-back samples instead of stretching
                  # the period without bound.
                  left_ms=$(( SAMPLE_PERIOD_MS - ($(date +%s%N) - sample_ns) / 1000000 ))
                  [ "${left_ms}" -gt 0 ] && sleep "0.$(printf '%03d' "${left_ms}")"
                done
                prompt_ms=$(( ($(date +%s%N) - started_ns) / 1000000 ))

                # 4. Record the measurement. Dynamic VRAM deliberately keeps what fits and evicts
                # under pressure; a post-prompt "settled" reading is not a contract. The load is
                # the measured claim; the no-OOM boundary is the device total.
                echo "VRAM before=${before} MiB peak=${peak} MiB"
                echo "prompt ${prompt_ms} ms; ${samples} samples at a ${SAMPLE_PERIOD_MS} ms period, largest gap ${max_gap_ms} ms"
                printf '%s prompt_ms=%s samples=%s max_gap_ms=%s period_ms=%s before_mib=%s peak_mib=%s rise_mib=%s\n' \
                  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${prompt_ms}" "${samples}" "${max_gap_ms}" \
                  "${SAMPLE_PERIOD_MS}" "${before}" "${peak}" "$((peak - before))" \
                  >> "${BASE}/charly-vram-offload.log" 2>/dev/null || true

                echo "the prompt completed under Dynamic VRAM: peak=${peak} MiB, before=${before} MiB, ${samples} samples over ${prompt_ms} ms"
            - run: write the runtime check that the emitted launch line still carries every flag the recipe promises
              write: /opt/comfyui/check-launch-flags.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                set -eu
                # The ONE assertion of the launch CONTRACT: every flag this recipe promises is on the
                # command line the container actually runs, and a later edit that drops one FAILS here.
                #
                # It reads the EMITTED /opt/comfyui/start-comfyui.sh and derives its facts from THAT
                # file -- it never carries a second copy of the launch line (R2), because a copy would
                # go green on itself while the launcher drifted underneath it.
                #
                # It isolates the LAUNCH COMMAND, never the whole file: the rationale comment block
                # above the launch NAMES the flags in prose, so a whole-file grep passes on a
                # launcher that has already lost one (measured: a whole-file grep for a flag exits 0
                # on a launch line that no longer passes it). Comments are stripped and the
                # backslash continuations joined, so the assertion sees the one command supervisord runs.
                LAUNCHER=/opt/comfyui/start-comfyui.sh
                if [ ! -s "${LAUNCHER}" ]; then
                  echo "${LAUNCHER} is missing or empty: there is no launch line to assert" >&2
                  exit 1
                fi
                launch=$(awk '
                  /^[[:space:]]*#/ { next }
                  { buf = buf $0
                    if (sub(/[[:space:]]*\\[[:space:]]*$/, " ", buf)) next
                    if (buf ~ /(^|[[:space:]])exec[[:space:]]/ && buf ~ /main\.py/) print buf
                    buf = ""
                  }
                  END { if (buf ~ /(^|[[:space:]])exec[[:space:]]/ && buf ~ /main\.py/) print buf }
                ' "${LAUNCHER}")
                if [ -z "${launch}" ]; then
                  echo "no 'exec python ... main.py' launch line in ${LAUNCHER}" >&2
                  exit 1
                fi
                # Dynamic VRAM is ON by default for torch >= 2.8 on Nvidia. The launch must carry
                # --vram-headroom and must NOT carry a mode flag that disables the allocator.
                missing=
                for flag in --vram-headroom; do
                  case " ${launch} " in
                    *" ${flag} "*) ;;
                    *) missing="${missing}${missing:+ }${flag}" ;;
                  esac
                done
                if [ -n "${missing}" ]; then
                  echo "the launch line in ${LAUNCHER} is missing: ${missing}" >&2
                  echo "launch line: ${launch}" >&2
                  exit 1
                fi
                forbidden=
                for flag in --disable-smart-memory --lowvram --novram --highvram --gpu-only --disable-dynamic-vram; do
                  case " ${launch} " in
                    *" ${flag} "*) forbidden="${forbidden}${forbidden:+ }${flag}" ;;
                  esac
                done
                if [ -n "${forbidden}" ]; then
                  echo "the launch line in ${LAUNCHER} carries a flag that disables Dynamic VRAM: ${forbidden}" >&2
                  echo "launch line: ${launch}" >&2
                  exit 1
                fi
                echo "launch line carries --vram-headroom and no legacy VRAM-mode flag"
            - run: write the start script that seeds the state tree, ensures the model, then execs the server
              write: /opt/comfyui/start-comfyui.sh
              mode: "0755"
              run_as: root
              content: |
                #!/bin/bash
                set -eu
                # The APPLICATION lives in the image (/opt/comfyui, pinned tag); ALL state lives in the
                # `comfyui` volume, addressed by ComfyUI's own --base-directory. ComfyUI creates only
                # some of these on demand, so the tree is seeded here: a missing custom_nodes/ is a
                # hard start failure (measured), and the model directories must exist before a
                # checkpoint is fetched into one.
                BASE="${HOME}/ComfyUI"
                mkdir -p "${BASE}"/{custom_nodes,input,output,user}
                mkdir -p "${BASE}"/models/{checkpoints,clip,clip_vision,configs,controlnet}
                mkdir -p "${BASE}"/models/{diffusers,diffusion_models,embeddings,gligen,hypernetworks,loras}
                mkdir -p "${BASE}"/models/{photomaker,style_models,text_encoders,unet,upscale_models,vae,vae_approx}
                # ONE fetch path for every model file, whatever declares it. Resume into a
                # .part, verify the sha256, then rename into place — extracted because the
                # single checkpoint and the model set were two copies of this same sequence
                # (R2), and a second copy drifts.
                . /opt/comfyui/fetch-lib.sh
                CKPT="${BASE}/models/checkpoints/${COMFYUI_MODEL}"
                fetch_verified "${CKPT}" \
                  "${COMFYUI_MODEL_URL:?COMFYUI_MODEL_URL must be declared by the candy or set per deploy}" \
                  "${COMFYUI_MODEL_SHA256:?COMFYUI_MODEL_SHA256 must be declared by the candy or set per deploy}"
                # The MODEL SET runs in the BACKGROUND, deliberately: the full set is ~128 GiB, and doing it
                # before the server starts would push every cold boot past the window this bed and
                # its callers allow for a first response. ComfyUI only needs these files when a
                # workflow references them, so the server comes up first and the weights land
                # behind it. Same discipline as the checkpoint: sha256 verified before the
                # move, and a .part is RESUMED (--continue-at -) rather than discarded.
                # The DECLARED set and its wait bound are written to files at launch, so the
                # assert-only check can read them WITHOUT a braced reference to a candy env
                # var: an unresolvable ${VAR} makes the step SKIP, and a skip reads green.
                # The manifest is copied into the image by the candy; strip comments/blank lines
                # into the state volume so the fetch and check scripts read one canonical list.
                MANIFEST=/opt/comfyui/model-manifest.tsv
                if [ ! -s "${MANIFEST}" ]; then
                  echo "no model manifest at ${MANIFEST}" >&2
                  exit 1
                fi
                grep -vE '^[[:space:]]*(#|$)' "${MANIFEST}" > "${BASE}/model-set.manifest"
                printf '%s\n' "${COMFYUI_MODEL_SET_WAIT_SECS:-600}" > "${BASE}/model-set.bound"
                if [ -s "${BASE}/model-set.manifest" ]; then
                  # setsid: its own session. `&` alone left this in the start script's process
                  # group and it was killed when the script exec'd the server, so the download
                  # never finished and model-set.done never appeared.
                  setsid /opt/comfyui/fetch-model-set.sh > /dev/null 2>&1 &
                  echo "model set fetching in its own session (log: ${BASE}/model-set-fetch.log)"
                else
                  touch "${BASE}/model-set.done"
                fi
                # Memory policy: Dynamic VRAM is ON by default (torch >= 2.8, Nvidia) and is the
                # mechanism that makes models larger than VRAM runnable. It faults weights in per
                # layer and evicts under pressure. Do NOT pass --lowvram/--novram/--highvram/
                # --gpu-only/--disable-dynamic-vram (each disables it) and do NOT pass
                # --disable-smart-memory, the legacy aggressive-offload switch. --vram-headroom is
                # the one policy knob: VRAM kept completely free, counting other apps (declared as
                # COMFYUI_VRAM_HEADROOM, default 1, overridable per deploy).
                exec python /opt/comfyui/main.py --listen 0.0.0.0 --port 8188 \
                  --enable-manager --base-directory "${BASE}" \
                  --vram-headroom "${COMFYUI_VRAM_HEADROOM}"
            - check: the image records the ComfyUI release tag it was built from
              id: comfyui-pinned-ref
              # No authored variable here on purpose: a braced ${VAR} the check context cannot
              # resolve makes the step SKIP, and a skip reads green (measured on a bed run --
              # "unresolved variables: COMFYUI_REF"). The BED owns the tag value and asserts it
              # against the server's own API; this check asserts the FILE, which needs no env.
              command: test -s /opt/comfyui/.charly-ref && grep -qE '^v[0-9]+\.[0-9]+' /opt/comfyui/.charly-ref
              exit_status: 0
            - check: the image carries the exact ComfyUI release tag this candy pins (v0.46.1)
              id: comfyui-pinned-ref-exact
              # A LITERAL, not a braced variable: a braced ${...} the check context cannot
              # resolve makes the step SKIP and a skip reads green (see the check above). This
              # literal is the in-tree version witness; the bed additionally asserts the
              # server's own /system_stats version.
              command: grep -qx 'v0.46.1' /opt/comfyui/.charly-ref
              exit_status: 0
            - check: the image's pixi env carries the pinned ComfyUI frontend, templates and docs
              id: comfyui-pinned-packages
              # The literal versions are the in-tree witness for the pixi.toml pins (the same
              # reason as the ref check: a braced variable would make the step SKIP).
              command: |
                python3 - <<'PY'
                from importlib.metadata import version
                want = {
                    "comfyui-frontend-package": "1.59.6",
                    "comfyui-workflow-templates": "0.11.112",
                    "comfyui-embedded-docs": "0.5.17",
                }
                bad = {k: (version(k), v) for k, v in want.items() if version(k) != v}
                assert not bad, bad
                print("pinned ComfyUI packages OK")
                PY
              exit_status: 0
            - check: the start script is present and executable
              id: comfyui-start-script
              file:
                file: /opt/comfyui/start-comfyui.sh
                exists: true
                mode: "0755"
            - check: the ComfyUI entrypoint is the image-owned application, not a git clone in the state volume
              id: comfyui-app-entrypoint
              file:
                file: /opt/comfyui/main.py
                exists: true
            - check: the legacy ComfyUI-Manager checkout is GONE — the built-in manager replaces it
              id: comfyui-legacy-manager-absent
              file:
                file: /opt/comfyui/custom_nodes/ComfyUI-Manager
                exists: false
            - check: aria2c is installed so model checkpoints can be fetched in parallel
              id: comfyui-aria2-binary
              file:
                file: /usr/bin/aria2c
                exists: true
            - check: git-lfs is installed for pulling large model repositories
              id: comfyui-git-lfs-package
              package:
                package: git-lfs
                installed: true
            - check: the live server reports its version and the GPU device
              id: comfyui-system-stats
              context:
                - runtime
              # On a FRESH volume the server is still fetching a 2 GB checkpoint when this runs;
              # a single-shot probe gets "connection reset by peer" (measured). The window makes
              # a cold boot a wait instead of a failure.
              eventually: 5m
              retry_interval: 10s
              http:
                http: http://127.0.0.1:${HOST_PORT:8188}/system_stats
                status: 200
                body:
                    - contains: comfyui_version
            - check: the model checkpoint lives in the STATE volume, not in the image
              id: comfyui-model-in-volume
              context:
                - runtime
              # BARE $VAR, not ${VAR}: the plan runner expands a braced reference against the
              # TASK env and SKIPS the step when it cannot (measured), while a bare reference
              # passes through to the shell, which reads the CONTAINER's environment at run
              # time. The `-n` guard matters: without it an unset name would test the
              # checkpoints/ DIRECTORY, and `test -s` on a directory is true.
              command: |
                set -eu
                test -n "$COMFYUI_MODEL"
                test -s "$HOME/ComfyUI/models/checkpoints/$COMFYUI_MODEL"
              exit_status: 0

            - check: the declared Z-Image model set has started fetching, and the first file has
                landed in the state volume — the mechanism is proven, not the whole set
              id: comfyui-model-set-in-volume
              context:
                - runtime
              # A SCRIPT, not an inline body. An assert-only step resolves only the runner's
              # auto-exported variables, so EVERY shell variable — even one the step assigns
              # itself, like `BOUND` — makes the assertion DEAD ("these names can never resolve
              # here: BOUND"). The logic lives in a file the image bakes, and this step is one
              # command with no variables of its own.
              command: /opt/comfyui/check-model-set.sh
              exit_status: 0

            - check: every model a shipped API workflow references has a canonical manifest row
              id: comfyui-model-manifest-complete
              context:
                - build
              command: /opt/comfyui/check-model-manifest.sh
              exit_status: 0

            - check: the env_provide base64 workflow copies equal the committed API workflow files
              id: comfyui-workflow-provides-match
              context:
                - build
              command: /opt/comfyui/check-workflow-provides.sh
              exit_status: 0

            - check: a prompt completes without OOM under Dynamic VRAM
              id: comfyui-vram-offload
              context:
                - runtime
              # Dynamic VRAM (comfy_aimdo) faults weights in per layer and evicts under pressure;
              # it also KEEPS a model resident, so a per-run load delta is not a contract. This
              # check runs one small generation, asserts a successful completion, and records the
              # device peak. The launch-flag contract (no legacy mode flags) is asserted by
              # comfyui-launch-flags.
              command: /opt/comfyui/check-vram-offload.sh
              exit_status: 0

            - check: the emitted launch line carries every flag the recipe promises — dropping one
                fails here, so the argument this recipe makes cannot silently rot
              id: comfyui-launch-flags
              context:
                - runtime
              # The guard for the flags themselves, where `comfyui-vram-offload` guards the EFFECT
              # of one of them: it reads the baked start-comfyui.sh, isolates the exec line, and
              # names the flag that is missing. `--vram-headroom` only sets how much VRAM stays
              # free, so nothing else in the image would notice its removal -- that is exactly the
              # claim this step makes checkable. Logic lives in the baked script: an assert-only
              # step carries no shell variables at all (measured).
              command: /opt/comfyui/check-launch-flags.sh
              exit_status: 0


comfyui-skill:
    skill:
        name: comfyui
        family: comfyui
        owner: comfyui
        description: |-
            ComfyUI image generation server with CUDA GPU support.
            Runs as a supervisord service on port 8188 with persistent storage.
            MUST be invoked before building, deploying, configuring, or troubleshooting the comfyui box.

# ---------------------------------------------------------------------------
# The verb/schema skills this repo's own candy owns — routing only.
#
# Each node carries `name`/`family`/`owner` (plus `triggers:` where the skill
# generates DISPATCHER.md rows, and a `description:` where the node states
# one). The BODY is the skill FILE at
# `<repo root>/.agents/skills/<name>/SKILL.md`, never an in-line `content:`:
# `charly box generate` READS that file and fails loudly when it is absent, and
# the marketplace generator hard-errors when a node's inline `description:` and
# its file's frontmatter disagree. `family:` is the marketplace family the skill
# was authored under, kept so every existing `/charly-<family>:<name>` address
# still resolves; `owner:` names the candy whose command/kind surface the
# skill documents. This candy composes no image, so these nodes add nothing to
# any `ai.opencharly.skill` OCI label; the bodies reach consumers through the
# generated marketplace corpus.
# ---------------------------------------------------------------------------
comfyui-layer-skill:
    skill:
        name: comfyui-layer
        family: comfyui
        owner: comfyui
