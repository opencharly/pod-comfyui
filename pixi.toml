[workspace]
name = "comfyui-environment"
version = "0.1.0"
description = "ComfyUI + ComfyUI-Manager environment with NVIDIA ML stack"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.13,<3.14"
pip = "*"

[pypi-dependencies]
# === PyTorch with CUDA 13.0 ===
torch = { version = "==2.12.0", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
torchaudio = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
xformers = { version = "*", index = "https://download.pytorch.org/whl/cu130" }

# === HuggingFace Core ===
transformers = ">=4.57.3"
accelerate = "*"
safetensors = ">=0.4.2"

# === ML Core ===
numpy = "<2.3"
scipy = "*"
einops = ">=0.7.0"
pillow = ">=10.0.0"
av = "*"
aiohttp = ">=3.9.0"
kornia = ">=0.7.1"
spandrel = ">=0.3.4"
torchsde = "*"
tqdm = "*"
psutil = "*"
pyyaml = "*"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
python-dotenv = "*"
gguf = "*"

# === ComfyUI ===

# ComfyUI core packages
comfyui-frontend-package = "==1.59.6"
comfyui-workflow-templates = "==0.11.112"
comfyui-embedded-docs = "==0.5.17"
comfy-kitchen = "==0.2.41"
comfy-aimdo = "==0.6.0"
simpleeval = ">=1.0.0"
blake3 = "*"
# Every requirement the pinned tag's own requirements.txt names and this env did not declare.
# comfy-angle is the one that MATTERED: without it ComfyUI logs
#   ModuleNotFoundError: No module named 'comfy_angle'   (nodes_glsl.py)
# on a live start -- found by RUNNING the image, not by reading the file.
comfy-angle = "*"
pyopengl = ">=3.1.8"
filelock = "*"

# NLP / Tokenization
tokenizers = ">=0.13.3"
sentencepiece = "*"

# Networking
yarl = ">=1.18.0"
requests = "*"

# Database (ComfyUI uses for workflow storage)
alembic = "*"
sqlalchemy = "*"

# ============================================================
# COMFYUI-MANAGER PACKAGES
# ============================================================

# THE manager itself. `main.py` only honours --enable-manager when `import comfyui_manager`
# succeeds; without this pin the flag is silently disabled, `/api/manager/version` answers 404,
# and the frontend's Nodes Manager shows "Please upgrade ComfyUI-Manager to version 4.2.1 or
# higher" on every load. 4.4.2 is the current release (Python >= 3.10). The dependency block
# below it was already here — the package was the missing half.
comfyui-manager = "==4.4.2"

gitpython = "*"
pygithub = "*"
matrix-nio = "*"
huggingface-hub = "*"
typer = "*"
rich = "*"
typing-extensions = "*"
toml = "*"
chardet = "*"

[environments]
default = { features = [], solve-group = "default" }
